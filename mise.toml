[tools]
bun = "latest"

[tasks."ext:install"]
description = "Copy the extension into ~/.pi-pocket and install its runtime"
run = "bun run scripts/install.ts"

[tasks.preview]
description = "Serve the terminal's page with a real shell, without Pi Pocket"
run = "bun run scripts/preview.ts"

[tasks.test]
description = "Run every test: the module against a real pty, and the page in a browser"
run = "bun test"

[tasks."test:fast"]
description = "Run the tests that need no browser"
run = "bun test test/escapes.test.ts test/module.test.ts test/pty-host.test.ts test/terminals.test.ts test/web.test.ts"

[tasks."gallery-entry"]
description = "Write docs/gallery-entry.json for HEAD, the commit that a release deploys"
run = "bun run scripts/gallery-entry.ts"

[tasks.sidecar]
description = "Write ghostty-terminal.gallery.json beside the installed drop-in, so Menu > Extensions shows its title"
run = "bun run scripts/sidecar.ts"

[tasks.check]
description = "Typecheck, and parse the browser module as a browser does"
run = "bun x tsc --noEmit && node --check extensions/ghostty-terminal/index.js && node --check extensions/ghostty-terminal/terminal.js"
